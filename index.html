<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>브라이트비드 공구</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="assets/app.css?v=202610230522">
</head>
<body data-page="index">
<div data-part="header"></div>

<main class="wrap">

  <!-- 히어로 -->
  <section class="hero">
    <div>
      <span class="anno">히어로</span>
      <div class="eyebrow"><span class="t" data-k="idx.1"></span></div>
      <h1><span class="t" style="--w:80%" data-k="idx.2"></span><span class="t" style="--w:62%" data-k="idx.3"></span></h1>
      <p class="lead lines"><span class="t" style="--w:100%" data-k="idx.4"></span><span class="t" style="--w:72%" data-k="idx.5"></span></p>
      <div class="cta-row">
        <a class="btn primary lg" href="#products"><span class="t" style="--w:5em" data-k="idx.9"></span></a>
        <a class="btn lg blue" href="#seller"><i data-i="users"></i><span class="t" style="--w:4em" data-k="idx.10"></span></a>
      </div>
    </div>
    <div class="hero-best">
      <span class="anno">BEST 공구 (자동)</span>
      <div class="hero-art" id="bestBox"><a class="best-card skel-best"><div class="img"></div><span class="best-rank">BEST 1</span></a><a class="best-card skel-best"><div class="img"></div><span class="best-rank">BEST 2</span></a><a class="best-card skel-best"><div class="img"></div><span class="best-rank">BEST 3</span></a></div>
      <p class="best-note"><span class="t" data-k="idx.best.note" style="--w:16em"></span></p>
    </div>
  </section>

  <!-- 상품 -->
  <section class="block" id="products">
    <span class="anno">상품 섹션</span>
    <div class="sec-head">
      <div>
        <h2 class="sec-title"><span class="t" data-k="idx.14"></span></h2>
        <p class="sec-sub"><span class="t" data-k="idx.15"></span></p>
      </div>
      <div class="sec-tools">
        <button class="btn btn-add sm" data-db-add="cat_products"><i data-i="plus"></i>상품 추가</button>
      </div>
    </div>
    <div class="filters">
      <div class="chips" id="catChips" data-single>
        <button class="chip on"><span class="t" style="--w:2em" data-k="idx.16"></span></button>
        <button class="chip"><span class="t" data-k="idx.17"></span></button>
        <button class="chip"><span class="t" style="--w:4em" data-k="idx.18"></span></button>
        <button class="chip"><span class="t" data-k="idx.19"></span></button>
      </div>
    </div>
    <div class="grid product-grid" id="productGrid" data-repeat="8" data-tpl="tpl-product">
      <button class="add-tile" data-db-add="cat_products"><span class="plus"><i data-i="plus"></i></span>상품 추가</button>
    </div>
  </section>

  <!-- 셀러 -->
  <section class="block" id="seller">
    <span class="anno">셀러 섹션</span>
    <div class="seller-sec">
      <div>
        <h2 class="sec-title"><span class="t" style="--w:9em" data-k="idx.20"></span></h2>
        <p class="sec-sub lines"><span class="t" style="--w:90%" data-k="idx.21"></span><span class="t" style="--w:60%" data-k="idx.22"></span></p>
        <div class="benefits">
          <div class="card benefit"><div class="ico"><i data-i="sparkle"></i></div><h4><span class="t" data-k="idx.23"></span></h4>
            <p class="lines" style="color:var(--ink-2);font-size:14px"><span class="t" style="--w:95%" data-k="idx.24"></span><span class="t" style="--w:60%" data-k="idx.25"></span></p></div>
          <div class="card benefit"><div class="ico"><i data-i="tag"></i></div><h4><span class="t" data-k="idx.26"></span></h4>
            <p class="lines" style="color:var(--ink-2);font-size:14px"><span class="t" style="--w:90%" data-k="idx.27"></span><span class="t" style="--w:70%" data-k="idx.28"></span></p></div>
          <div class="card benefit"><div class="ico"><i data-i="truck"></i></div><h4><span class="t" data-k="idx.29"></span></h4>
            <p class="lines" style="color:var(--ink-2);font-size:14px"><span class="t" style="--w:100%" data-k="idx.30"></span><span class="t" style="--w:55%" data-k="idx.31"></span></p></div>
        </div>
        <ol class="flow">
          <li><span class="t" style="--w:5em" data-k="idx.32"></span><p class="lines"><span class="t" style="--w:80%" data-k="idx.33"></span></p></li>
          <li><span class="t" style="--w:6em" data-k="idx.34"></span><p class="lines"><span class="t" style="--w:70%" data-k="idx.35"></span></p></li>
          <li><span class="t" style="--w:5em" data-k="idx.36"></span><p class="lines"><span class="t" style="--w:75%" data-k="idx.37"></span></p></li>
        </ol>
        <div class="cta-row" style="margin-top:20px">
          <a class="btn blue" href="seller.html"><i data-i="lock"></i><span class="t" style="--w:4em" data-k="idx.38"></span></a>
        </div>
      </div>
      <div class="card form-card join-card">
        <h3><span class="t" data-k="idx.join.title"></span></h3>
        <p class="lines" style="color:var(--ink-2)"><span class="t" data-k="idx.join.desc" style="--w:90%"></span></p>
        <a class="join-opt" href="vendor.html"><span class="join-ico"><i data-i="store"></i></span><span class="grow"><b><span class="t" data-k="idx.join.v.title" style="--w:6em"></span></b><small><span class="t" data-k="idx.join.v.desc" style="--w:12em"></span></small></span><span class="join-go">›</span></a>
        <a class="join-opt" href="personal.html"><span class="join-ico"><i data-i="users"></i></span><span class="grow"><b><span class="t" data-k="idx.join.p.title" style="--w:6em"></span></b><small><span class="t" data-k="idx.join.p.desc" style="--w:12em"></span></small></span><span class="join-go">›</span></a>
      </div>
    </div>
  </section>

  <!-- 관리자 -->
  <section class="block" id="admin" data-admin-only>
    <div class="admin-sec on-dark">
      <span class="anno">관리자 섹션 · 관리자만 보임</span>
      <div class="sec-head">
        <div>
          <h2 class="sec-title"><span class="t" data-k="idx.56"></span></h2>
          <p class="sec-sub"><span class="t" data-k="idx.57"></span></p>
        </div>
        <a class="btn primary" href="admin.html"><i data-i="gear"></i>관리자 페이지<i data-i="external"></i></a>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="label">브랜드</div><span class="val"><span class="num" data-kpi></span></span></div>
        <div class="kpi"><div class="label">상품</div><span class="val"><span class="num" data-kpi></span></span></div>
        <div class="kpi"><div class="label">승인 대기 셀러</div><span class="val"><span class="num" data-kpi></span></span></div>
        <div class="kpi"><div class="label">새 공구 신청·문의</div><span class="val"><span class="num" data-kpi></span></span></div>
      </div>
      <div class="admin-grid">
        <div class="admin-box">
          <div class="admin-box-head"><h4>최근 신청</h4><a class="btn sm" href="admin.html#apps">전체 보기</a></div>
          <div id="adminRecent"></div>
        </div>
        <div class="admin-box">
          <div class="admin-box-head"><h4>바로가기</h4></div>
          <div class="quick">
            <button class="btn btn-add" data-db-add="cat_brands"><i data-i="plus"></i>브랜드 추가</button>
            <button class="btn btn-add" data-db-add="cat_products"><i data-i="plus"></i>상품 추가</button>
            <a class="btn" href="admin.html#sellers"><i data-i="users"></i>셀러 관리</a>
            <a class="btn" href="admin.html#apps"><i data-i="inbox"></i>공구 신청</a>
            <a class="btn" href="admin.html#content"><i data-i="edit"></i>사이트 문구</a>
            <a class="btn" href="admin.html#settings"><i data-i="gear"></i>설정</a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div data-part="footer apply"></div>


<!-- 복제용 템플릿 -->
<template id="tpl-brand">
  <a class="card brand-card">
    <button class="card-del" data-db-del><i data-i="trash"></i>삭제</button>
    <div class="img cover" data-fi="cover_url"></div>
    <div class="body">
      <div class="img round" data-fi="logo_url"></div>
      <div style="display:flex;gap:6px"><span class="badge solid"><span class="t" data-f="badge"></span></span><span class="badge"><span class="t" data-f="category"></span></span></div>
      <h3><span class="t" data-f="name" data-r="45-70"></span></h3>
      <p class="lines" style="color:var(--ink-2);font-size:14px"><span class="t" data-f="one_liner" data-r="80-100"></span></p>
      <div class="meta"><span class="badge accent"><span class="t" data-f="tags.0"></span></span><span class="badge" data-count></span></div>
    </div>
  </a>
</template>

<template id="tpl-product">
  <a class="card p-card">
    <div class="media">
      <button class="card-del" data-db-del><i data-i="trash"></i>삭제</button>
      <div class="img" data-fi="images.0"></div>
      <button class="wish" aria-pressed="false" aria-label="찜"><i data-i="heart"></i></button>
      <div class="badges"><span class="badge solid"><span class="t" data-f="badge"></span></span></div>
    </div>
    <div class="info">
      <span class="brand"><span class="t" data-brand-name data-noedit></span></span>
      <span class="name"><span class="t" data-f="name" data-r="70-100"></span></span>
      <span class="p-desc"><span class="t" data-f="summary" data-r="80-100"></span></span>
    </div>
  </a>
</template>

<template id="tpl-admin-row">
  <div class="list-row">
    <span class="avatar"></span>
    <span class="grow"><span class="t" data-x="title" style="--w:50%"></span><span class="t" data-x="sub" style="--w:70%;height:.55em"></span></span>
    <span class="badge warn"><span class="t" data-x="status"></span></span>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/db.js?v=202610230522"></script>
<script src="assets/app.js?v=202610230522"></script>
<script src="assets/site.js?v=202610230522"></script>
</body>
</html>
