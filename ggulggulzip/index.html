<style>

  @keyframes sh { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 18px; border-radius: 999px; background: var(--pink-deep); color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; border: 0; font-family: inherit; cursor: pointer; }

  .toast {

    background: var(--ink); color: #fff; padding: 11px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
    transition: .2s ease; pointer-events: none; white-space: nowrap; z-index: 9;

  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  @media (min-width: 520px) { .wrap { padding-top: 34px; } h1 { font-size: 30px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<script>
(function () {
  'use strict';
  var FN = 'https://ckyjkxbqsyjoqpuqwoce.supabase.co/functions/v1/ggul-links';
  var SHORT = 'https://brightbeed.kr/ggulggulzip/';
  var COPY_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
  var params = new URLSearchParams(location.search);
  var focusQ = Number(params.get('s')) || 0;
  var $list = document.getElementById('list');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function won(n) { return Number(n).toLocaleString('ko-KR') + '원'; }
  function when(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    var f = new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: 'long', day: 'numeric', weekday: 'short', hour: 'numeric', hour12: true });
    var p = {}; f.formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
    return p.month + ' ' + p.day + '일 (' + p.weekday + ') ' + (p.dayPeriod || '') + ' ' + p.hour + '시 기준';
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('on'); }, 1800);
  }
  function legacyCopy(s) { // 인스타 · 카톡 안 브라우저처럼 clipboard API 가 막힌 곳
    return new Promise(function (ok, no) {
      var a = document.createElement('textarea'); a.value = s; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.top = '0'; a.style.opacity = '0';
      document.body.appendChild(a); a.focus(); a.select(); a.setSelectionRange(0, s.length);
      try { document.execCommand('copy') ? ok() : no(); } catch (e) { no(e); } finally { a.remove(); }
    });
  }
  function copyText(s) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(s).catch(function () { return legacyCopy(s); });
    return legacyCopy(s);
  }
  function stickerClass(label) {
    var l = String(label || '').toUpperCase();
    if (/NEW|신상|새/.test(l)) return 'new';
    if (/긴급|URGENT|마감|품절/.test(l)) return 'urgent';
    return '';
  }

  function dealHtml(l, go) {
    var off = (l.original_price > 0 && l.price >= 0 && l.original_price > l.price) ? Math.floor((l.original_price - l.price) / l.original_price * 100) : 0;
    var price = '';
    if (l.price != null) {
      price = '<div class="price">' + (off > 0 ? '<span class="off">' + off + '%</span>' : '') + '<span class="now">' + won(l.price) + '</span>'
        + (off > 0 ? '<span class="was">' + won(l.original_price) + '</span>' : '') + '</div>';
    }
    var thumb = l.image_url
      ? '<img src="' + esc(l.image_url) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">'
      : '';
    return '<div class="deal"><a class="deal-link" href="' + esc(go + l.slug) + '" rel="nofollow noopener">'
      + '<div class="thumb">🍯' + thumb + (l.label ? '<span class="sticker ' + stickerClass(l.label) + '">' + esc(l.label) + '</span>' : '') + '</div>'
      + '<div class="info"><div class="title">' + esc(l.title) + '</div>'
      + (l.host ? '<div class="host">' + esc(l.host) + '</div>' : '')
      + price + (l.note ? '<div class="note">' + esc(l.note) + '</div>' : '')
      + '<span class="go">보러 가기 →</span></div></a>'
      + '<button class="copy" type="button" data-slug="' + esc(l.slug) + '" aria-label="짧은 링크 복사">' + COPY_SVG + '</button>'
      + '</div>';
  }

  function render(data) {
    var go = data.go || (FN + '/go/');
    var sets = (data.sets || []).slice();
    var focusIdx = focusQ ? sets.findIndex(function (s) { return s.queue_id === focusQ; }) : -1;
    if (focusIdx > 0) sets.unshift(sets.splice(focusIdx, 1)[0]);
    var notice = document.getElementById('notice');
    if (focusQ && focusIdx === -1 && sets.length) { notice.textContent = '찾으신 게시물 링크는 곧 올라와요. 지금 모아 둔 꿀딜부터 보세요!'; notice.hidden = false; }

    var html = sets.map(function (s, i) {
      var isFocus = focusQ && s.queue_id === focusQ;
      return '<section class="set' + (isFocus ? ' focus' : '') + '" id="set-' + s.id + '">'
        + '<div class="set-head"><span class="ic">' + (i === 0 ? '🍯' : '🐷') + '</span><div><h2>' + esc(s.title || '오늘의 꿀딜') + '</h2>'
        + '<span class="when">' + esc(when(s.as_of)) + '</span></div></div>'
        + (s.subtitle ? '<p class="set-sub">' + esc(s.subtitle) + '</p>' : '')
        + '<div class="deals">' + s.links.map(function (l) { return dealHtml(l, go); }).join('') + '</div></section>';
    }).join('');
    if ((data.loose || []).length) {
      html += '<section class="set"><div class="set-head"><span class="ic">🔗</span><div><h2>꿀꿀집 추천 링크</h2></div></div>'
        + '<div class="deals">' + data.loose.map(function (l) { return dealHtml(l, go); }).join('') + '</div></section>';
    }
    if (!html) {
      html = '<div class="empty"><b>꿀딜을 모으는 중이에요 🐷</b><p>새 꿀딜이 올라오면 여기에 가장 먼저 모아 둘게요.</p>'
        + '<a class="btn" href="https://www.instagram.com/ggul.ggul.zip/" rel="noopener">인스타에서 먼저 보기</a></div>';
    }
    $list.innerHTML = html;
  }

  function load() {
    fetch(FN, { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () {
        $list.innerHTML = '<div class="empty"><b>잠깐 연결이 안 돼요</b><p>잠시 뒤 다시 눌러 주세요.</p><button class="btn" type="button" id="retry">다시 불러오기</button></div>';
        document.getElementById('retry').onclick = function () { $list.innerHTML = '<div class="set"><div class="deals"><div class="skel"></div><div class="skel"></div></div></div>'; load(); };
      });
  }

  $list.addEventListener('click', function (e) {
    var b = e.target.closest('.copy');
    if (!b) return;
    e.preventDefault();
    var link = SHORT + b.getAttribute('data-slug');
    copyText(link).then(function () { toast('짧은 링크를 복사했어요'); }, function () { toast(link.replace('https://', '')); });
  });
  // 공유: 휴대폰은 공유 창, PC(또는 공유 창이 안 뜨는 앱 안 브라우저)는 주소 복사 + 안내 — 눌렀는데 아무 일도 없는 경우를 없앤다
  document.getElementById('share').addEventListener('click', function () {
    var url = 'https://brightbeed.kr/ggulggulzip/';
    var copy = function () { copyText(url).then(function () { toast('주소를 복사했어요. 붙여넣어 공유해 주세요'); }, function () { toast(url.replace('https://', '')); }); };
    var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
    if (mobile && navigator.share) {
      navigator.share({ title: '꿀꿀집 · 오늘의 꿀딜 모음', text: '꿀 같은 특가만 쏙쏙 모았어요 🍯', url: url })
        .catch(function (e) { if (!e || e.name !== 'AbortError') copy(); });
      return;
    }
    copy();
  });
  load();
})();
</script>
